<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List Page</title>
</head>

<body>

    <!-- list ul ol -->

    <h1>this list ul</h1>
    <ul>
        <li>list 1</li>
        <li>list 2</li>
        <ul>
            <li>list 1</li>
            <li>list 2</li>
            <li>list 3</li>
            <li>list 4</li>
        </ul>
        <li>list 3</li>
        <li>list 4</li>
    </ul>

    <h1>this list ou</h1>
    <ol>
        <li>list 1</li>
        <li>list 2</li>
        <li>list 3</li>
        <li>list 4</li>
    </ol>

    <!-- table -->
    <h1>this list Table</h1>
    <table>
    <tr>
        <th>Header 1</th>
        <th>Header 2</th>
        <th>Header 3</th>
    </tr>
    <tr>
        <td>Body 1</td>
        <td>Body 2</td>
        <td>Body 3</td>
    </tr>
    </table>

</body>

</html>
