<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>5-1 · Create &amp; remove elements</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
  <link rel="stylesheet" href="./part5.css">
</head>
<body>
  <main>
    <h1>5-1 · Create &amp; remove elements</h1>
    <p class="lead">Camp snack list: type a snack and press Add: a new &lt;li&gt; appears, with its own Delete button.</p>

    <div class="panel">
      <div class="row">
        <input id="item" placeholder="e.g. Pocky" autocomplete="off">
        <button id="add">Add</button>
      </div>
      <ul id="list" class="list"></ul>
    </div>
  </main>

  <script src="script.js"></script>
